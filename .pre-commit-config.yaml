# Source of truth for "what must pass before code is committed" — CI runs
# `pre-commit run --all-files` so it enforces exactly these same checks.
repos:
  - repo: local
    hooks:
      # always_run + pass_filenames: false → the full suite runs on every commit,
      # even one that only touches config (pyproject.toml, compose, .env.example),
      # since those can change the checks' outcome too.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
